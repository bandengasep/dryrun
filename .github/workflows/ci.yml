name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck core
        run: pnpm --filter @dryrun/core typecheck
      - name: Test core (vitest)
        run: pnpm --filter @dryrun/core test
      - name: Challenge executability (harness)
        run: pnpm --filter @dryrun/core test:executability
      - name: Build web (next build)
        run: pnpm --filter web build
